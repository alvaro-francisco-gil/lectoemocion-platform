name: check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The same gate an agent must run locally before claiming completion.
      - run: pnpm check

  # Three viewport projects plus the build-based bypass spec, several of them
  # watching fixed timelines play out. It is minutes of wall-clock by design,
  # so the budget is generous enough that a slow runner is not a red build.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/player-web

      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/player-web/playwright-report/
          retention-days: 7

  # Immediate trigger for the self-hosted agentic reviewer, so a PR opened and
  # merged inside one poll interval is not missed by github-review's 15-minute
  # poll backstop.
  #
  # INERT, and further from working than the same job in the other repos: it needs
  # a `lectoemocion-platform` entry in homelab's personal/agent-review.yml (which
  # lists homelab, ordago-apps and cultuvilla only) AND the SELF_HOSTED_REVIEW
  # repository variable. It lands now so that turning review back on is config, not
  # workflow authoring — see the flip-back note in .agents/land.config.json.
  #
  # `!failure() && !cancelled()` rather than `success()`: a skipped job is not a
  # reason to skip review, but a real test failure is.
  request-review:
    needs: [check, e2e]
    if: >-
      github.event_name == 'pull_request' && !failure() && !cancelled()
      && github.event.pull_request.draft == false
      && github.event.pull_request.head.repo.full_name == github.repository
      && vars.SELF_HOSTED_REVIEW == 'true'
      && contains(github.event.pull_request.labels.*.name, 'ai-review')
    uses: alvaro-francisco-gil/homelab/.github/workflows/request-review.yml@main
    with:
      pr_number: ${{ github.event.pull_request.number }}
